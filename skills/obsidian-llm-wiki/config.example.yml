# Obsidian LLM Wiki — Local Configuration
#
# Copy this file to `config.local.yml` and fill in your values.
# `config.local.*` is gitignored, so your real paths never get committed.

# Absolute path to your Obsidian vault root.
# Examples:
#   ~/Documents/MyVault
#   ~/Library/Mobile Documents/iCloud~md~obsidian/Documents/MyVault
VAULT_PATH: "~/path/to/your/obsidian-vault"

# Where the canonical files live and how they sync across devices.
# One of: iCloud | local | git
# - iCloud: vault lives in iCloud Drive; symlink into workspace for git tracking of snapshots
# - local: single-machine, no sync
# - git: vault itself is the git repo (uncommon for live notes)
PRIMARY_SYNC: "local"

# Time-of-day when the daily snapshot cron fires (24h, local time).
# Used by bin/snapshot.sh + a launchd / cron / Task Scheduler entry.
# Leave blank to disable scheduled snapshots.
SNAPSHOT_TIME: "23:00"

# How the agent refers to itself in log.md entries.
# Examples: "claude", "codex", "gemini"
AGENT_NAME: "agent"

# Optional — override the standard subdirectory names if your vault uses different ones.
# Defaults match the methodology skill.
DIRS:
  raw: "raw"
  concepts: "wiki/concepts"
  entities: "wiki/entities"
  records: "wiki/records"
  diagrams: "attachments/diagrams"
