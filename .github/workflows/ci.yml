name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint (sensitive data + native frontmatter)
        run: ./scripts/lint.sh

      - name: Verify dist/ is in sync with skills/
        run: python3 ./scripts/build.py --check

      - name: Dry-run install
        run: |
          mkdir -p /tmp/agy-home
          HOME=/tmp/agy-home ./scripts/install.sh --dry-run all
